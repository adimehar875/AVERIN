<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame | AVERIN</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ee;
            color: #222;
        }

        .product-page {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #222;
            text-decoration: none;
            font-size: 16px;
        }

        .product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .product-image {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .product-image img {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        .product-info h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .product-info p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #555;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .order-btn {
            display: inline-block;
            padding: 14px 28px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
        }

        .order-btn:hover {
            opacity: 0.85;
        }

        @media (max-width: 700px) {
            .product {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .product-info h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="product-page">

        <a href="index.html" class="back">← Back to Home</a>

        <div class="product">

            <div class="product-image">
                <img src="frame.jpeg.jpeg" alt="Premium Frame">
            </div>

            <div class="product-info">
                <h1>Premium Frame</h1>

                <p>
                    Give your space a stylish and elegant look with our
                    premium decorative frame.
                </p>

                <div class="price">PKR 2,000</div>

                <a href="https://wa.me/923420604105?text=I%20want%20to%20order%20the%20Premium%20Frame"
                   class="order-btn">
                    Order Now
                </a>
            </div> class="product">

            <div class="product-image">
                <img src="frame.jpeg2.jpeg" alt="Frame 2">
            </div>

            <div class="product-info">
                <h1>Frame 2</h1>

                <p>
                    Stylish decorative frame for a premium look.
                </p>

                <div class="price">PKR 2,000</div>

                <a href="https://wa.me/923420604105?text=I%20want%20to%20order%20Frame%202"
                   class="order-btn">
                    Order Now
                </a>
            </div>

        </div>

        <div class="product">

            <div class="product-image">
                <img src="frame.jpeg3.jpeg" alt="Frame 3">
            </div>

            <div class="product-info">
                <h1>Frame 3</h1>

                <p>
                    Stylish decorative frame for a premium look.
                </p>

                <div class="price">PKR 2,500</div>

                <a href="https://wa.me/923420604105?text=I%20want%20to%20order%20Frame%203"
                   class="order-btn">
                    Order Now
                </a>
            </div>

        </div>

        </div>

    </div>

</body>
</html>
